<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fffd"/>
      <stop offset="1" stop-color="#faf7ff"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font:800 48px Arial,sans-serif;fill:#0f172a}
      .st{font:400 21px Arial,sans-serif;fill:#475569}
      .n{font:700 22px Arial,sans-serif;fill:#0f172a}
      .c{font:400 16px Arial,sans-serif;fill:#475569}
      .w{font:700 22px Arial,sans-serif;fill:#fff}
      .wc{font:400 16px Arial,sans-serif;fill:#ecfeff}
      .tag{font:700 14px Arial,sans-serif;fill:#0f766e;letter-spacing:.8px}
      .arr{fill:none;stroke:#64748b;stroke-width:4;marker-end:url(#a)}
      .yes{font:700 15px Arial,sans-serif;fill:#be123c}
      .no{font:700 15px Arial,sans-serif;fill:#0f766e}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <circle cx="1460" cy="90" r="230" fill="#ccfbf1" opacity=".6"/>
  <circle cx="110" cy="820" r="230" fill="#ede9fe" opacity=".65"/>

  <text x="75" y="76" class="t">Alur Pengguna dan Keputusan AI</text>
  <text x="75" y="112" class="st">Dua jalur AI membantu persiapan, tetapi tidak pernah menggantikan persetujuan dan tinjauan manusia.</text>

  <rect x="70" y="155" width="1460" height="655" rx="34" fill="#fff" opacity=".88" stroke="#dbe7e4" filter="url(#s)"/>

  <rect x="115" y="215" width="240" height="115" rx="24" fill="#0f766e" filter="url(#s)"/>
  <text x="153" y="262" class="w">Mulai AmanAkses</text>
  <text x="153" y="292" class="wc">Pengguna memilih langkah.</text>

  <path d="M355 272 H445" class="arr"/>
  <polygon points="570,205 690,272 570,339 450,272" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <text x="503" y="263" class="n">Butuh apa?</text>
  <text x="494" y="289" class="c">navigasi atau kronologi</text>

  <path d="M570 339 V410" class="arr"/>
  <text x="590" y="377" class="tag">KRONOLOGI</text>

  <rect x="430" y="425" width="280" height="120" rx="24" fill="#ecfdf5" stroke="#5eead4" stroke-width="3"/>
  <text x="465" y="469" class="n">Pilih catatan</text>
  <text x="465" y="498" class="c">Hanya data yang dipilih</text>
  <text x="465" y="523" class="c">boleh diproses.</text>

  <path d="M710 485 H775" class="arr"/>
  <rect x="790" y="425" width="290" height="120" rx="24" fill="#6d28d9" filter="url(#s)"/>
  <text x="825" y="469" class="w">Gemini / fallback</text>
  <text x="825" y="498" class="wc">Ekstraksi terstruktur</text>
  <text x="825" y="523" class="wc">tanpa menebak data hilang.</text>

  <path d="M1080 485 H1145" class="arr"/>
  <rect x="1160" y="425" width="280" height="120" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="1195" y="469" class="n">Tinjau setiap event</text>
  <text x="1195" y="498" class="c">Edit • terima • tolak</text>
  <text x="1195" y="523" class="c">Sumber tetap terlihat.</text>

  <path d="M1300 545 V610" class="arr"/>
  <rect x="1160" y="625" width="280" height="110" rx="24" fill="#0f766e" filter="url(#s)"/>
  <text x="1195" y="670" class="w">Laporan awal</text>
  <text x="1195" y="699" class="wc">Hanya hasil yang diterima.</text>

  <path d="M690 272 H790" class="arr"/>
  <text x="703" y="252" class="tag">NAVIGASI / BANTUAN</text>

  <rect x="805" y="212" width="275" height="120" rx="24" fill="#ecfeff" stroke="#5eead4" stroke-width="3"/>
  <text x="840" y="256" class="n">Asisten Aman</text>
  <text x="840" y="285" class="c">Menjelaskan fitur dan</text>
  <text x="840" y="310" class="c">menyarankan route internal.</text>

  <path d="M1080 272 H1140" class="arr"/>
  <polygon points="1270,205 1395,272 1270,339 1145,272" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/>
  <text x="1195" y="263" class="n">Bahaya langsung?</text>
  <text x="1217" y="289" class="c">deteksi konservatif</text>

  <path d="M1270 339 V375 H1120 V590 H950 V610" class="arr"/>
  <text x="1290" y="370" class="yes">YA</text>
  <rect x="795" y="625" width="310" height="110" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/>
  <text x="830" y="666" class="n">Prioritas keselamatan</text>
  <text x="830" y="695" class="c">Bantuan manusia • pusat bantuan</text>
  <text x="830" y="718" class="c">• keluar cepat</text>

  <path d="M1395 272 H1490 V780 H560 V750" class="arr"/>
  <text x="1410" y="252" class="no">TIDAK</text>

  <rect x="405" y="625" width="310" height="110" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <text x="440" y="666" class="n">Route fitur yang sesuai</text>
  <text x="440" y="695" class="c">Jurnal • edukasi • pendamping</text>
  <text x="440" y="718" class="c">• aksesibilitas • laporan</text>
  <rect x="115" y="625" width="235" height="110" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="150" y="666" class="n">Kendali pengguna</text>
  <text x="150" y="695" class="c">Tidak ada pengiriman</text>
  <text x="150" y="718" class="c">atau keputusan otomatis.</text>
  <path d="M405 680 H365" class="arr"/>

  <text x="75" y="855" class="c">Catatan: chatbot bukan konselor atau layanan darurat; timeline bukan alat verifikasi kebenaran.</text>
</svg>
